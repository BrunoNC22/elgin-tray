[package]
name = "elgin-tray"
description = "Composition root: monta o daemon da bandeja, o painel e a CLI de desenvolvimento, escolhendo os adaptadores de cada sistema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "elgin-tray"
path = "src/main.rs"

[dependencies]
elgin-domain = { workspace = true }
elgin-application = { workspace = true }
elgin-tuya-lan = { workspace = true }
elgin-tuya-cloud = { workspace = true }
elgin-config = { workspace = true }
elgin-ipc = { workspace = true }
elgin-icons = { workspace = true }
elgin-updater = { workspace = true }
elgin-panel = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net"] }

[target.'cfg(windows)'.dependencies]
elgin-tray-windows = { workspace = true }
elgin-platform-windows = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
elgin-tray-kde = { workspace = true }
elgin-platform-linux = { workspace = true }

[dev-dependencies]
elgin-application = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
