[package]
name = "elgin-updater"
description = "Adaptador: releases do GitHub e verificação de assinatura das atualizações."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
elgin-application = { workspace = true }
log = { workspace = true }
self-replace = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
ureq = { workspace = true }
zip = { workspace = true }
zipsign-api = { workspace = true, features = ["verify-zip"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
