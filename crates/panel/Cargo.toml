[package]
name = "elgin-panel"
description = "Painel (Slint) aberto pela bandeja e o seu view-model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
elgin-domain = { workspace = true }
elgin-ipc = { workspace = true }
slint = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
