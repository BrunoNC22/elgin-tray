[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/BrunoNC22/elgin-tray"
publish = false

# Crates internas. Adicione as dependências externas compartilhadas aqui também,
# e nas crates use `dep = { workspace = true }`.
[workspace.dependencies]
elgin-domain = { path = "crates/domain" }
elgin-application = { path = "crates/application" }
elgin-tuya-lan = { path = "crates/tuya-lan" }
elgin-tuya-cloud = { path = "crates/tuya-cloud" }
elgin-config = { path = "crates/config" }
elgin-ipc = { path = "crates/ipc" }
elgin-icons = { path = "crates/icons" }
elgin-tray-windows = { path = "crates/tray-windows" }
elgin-tray-kde = { path = "crates/tray-kde" }
elgin-platform-windows = { path = "crates/platform-windows" }
elgin-platform-linux = { path = "crates/platform-linux" }
elgin-updater = { path = "crates/updater" }
elgin-panel = { path = "crates/panel" }

# Externas
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
directories = "6"
hmac = "0.12"
interprocess = { version = "2", features = ["tokio"] }
log = { version = "0.4", features = ["std"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "unstable-winit-030"] }
slint-build = "1.18"
socket2 = "0.6"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tokio = { version = "1", default-features = false }
toml = "1"
tray-icon = "0.26"
ureq = "3"
zipsign-api = { version = "0.2.2", default-features = false }
self-replace = "1.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = "0.61"

[workspace.lints.rust]
# `deny` (e não `forbid`) para permitir `#[allow(unsafe_code)]` pontual em código de FFI,
# sempre com um comentário explicando o motivo.
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
